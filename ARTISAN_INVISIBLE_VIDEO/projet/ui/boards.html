<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Planches d'interface photographiées en textures pour les écrans 3D de la publicité.
     Studio : libellés, couleurs, icônes et polices repris de la version actuelle d'E-COM STUDIO IA (origin/main).
     3M Plâtrerie Peinture : entreprise fictive créée pour la publicité (logo, site, visuels). -->
<style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Brico;src:url(../assets/fonts/bricolage.woff2) format("woff2");font-weight:200 800}
@font-face{font-family:Instr;src:url(../assets/fonts/instrument-italic.woff2) format("woff2");font-style:italic}
@font-face{font-family:Outfit;src:url(../assets/fonts/outfit-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:Outfit;src:url(../assets/fonts/outfit-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:Lato;src:url(../assets/fonts/lato-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:Lato;src:url(../assets/fonts/lato-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:Lato;src:url(../assets/fonts/lato-latin-900-normal.woff2) format("woff2");font-weight:900}
:root{--paper:#F5F7FC;--paper2:#EAEEF7;--card:#fff;--ink:#0A1024;--ink2:#2B3452;--muted:#5E6886;--line:#DCE2EE;--signal:#2F5BEA;--soft:#E3E9FD;
  --g:#1E6B5E;--ocre:#E3A53C;--chaux:#F3EEE6;--sable:#D8CDBB;--anth:#1F2A2E;--txt:#4A5458}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:Inter;color:var(--ink);-webkit-font-smoothing:antialiased}
[data-board]{position:relative;overflow:hidden;margin:20px}
.ic{display:inline-block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- navigateur ---------- */
.win{background:var(--paper);display:flex;flex-direction:column;border-radius:18px}
.chrome{height:44px;background:#DFE4EC;display:flex;align-items:flex-end;padding:0 14px;gap:8px}
.dots{display:flex;gap:8px;align-self:center;margin-right:10px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
.tab{height:36px;background:#fff;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:9px;padding:0 14px;font:500 13px Inter;color:var(--ink2);width:400px;white-space:nowrap}
.bar{height:42px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);color:#7A839C}
.addr{flex:1;height:28px;border-radius:14px;background:#F1F3F8;display:flex;align-items:center;padding:0 12px;gap:8px}
/* ---------- studio ---------- */
.studio{flex:1;display:flex;min-height:0;position:relative}
.side{width:248px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font:800 19px Brico;letter-spacing:-.02em;white-space:nowrap}
.side .logo{font-size:16px;gap:8px}.side .logo .ia{font-size:18px}
.logo .ia{font:italic 400 21px Instr;color:var(--signal);margin-left:-5px;letter-spacing:0}
.proj{margin:16px 0 14px;border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.proj .sq{width:36px;height:36px;border-radius:10px;background:var(--paper2);display:grid;place-items:center}
.grp{font:600 10.5px Inter;letter-spacing:.16em;color:var(--muted);margin:12px 10px 6px}
.it{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;font:500 14.5px Inter;color:var(--ink2)}
.it.on{background:var(--ink);color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:62px;display:flex;align-items:center;padding:0 22px;gap:10px;border-bottom:1px solid var(--line);background:var(--paper)}
.ttl{font:700 20px Brico;letter-spacing:-.02em}.sub{font:400 12.5px Inter;color:var(--muted)}
.pill{height:36px;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 13px;font:500 13px Inter;color:var(--ink2)}
.pill.blue{background:var(--signal);color:#fff;border-color:var(--signal)}
.fr{display:flex;border:1px solid var(--line);border-radius:18px;background:#fff;padding:3px;gap:2px;font:700 12px Inter}
.fr b{background:var(--ink);color:#fff;border-radius:14px;padding:6px 9px}.fr span{padding:6px 9px;color:var(--muted)}
.tabs3{display:flex;justify-content:center;gap:10px;padding:12px 22px}
.tabs3 div{flex:1;max-width:240px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px Inter;color:var(--ink2)}
.tabs3 .on{background:var(--ink);color:#fff}
.tool{display:flex;align-items:center;gap:8px;padding:0 22px 10px;flex-wrap:wrap}
.chip{height:34px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;gap:7px;padding:0 11px;font:500 12.5px Inter;color:var(--ink2)}
.ver{height:28px;border-radius:9px;background:var(--paper2);display:flex;align-items:center;padding:0 10px;font:600 12px Inter;color:var(--ink2)}
.prev{flex:1;margin:0 22px 18px;border-radius:16px;background:#E9EDF5;overflow:hidden;position:relative;border:1px solid var(--line)}
/* ---------- SYNA ---------- */
.syna{position:absolute;top:14px;right:14px;bottom:14px;width:390px;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(10,16,36,.18);display:flex;flex-direction:column;overflow:hidden}
.synh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font:600 14px Inter}
.eyeb{display:flex;align-items:center;gap:8px;font:600 11.5px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--signal)}
.note{display:flex;gap:8px;align-items:flex-start;font:400 12px/1.35 Inter;color:var(--muted)}
.you{align-self:flex-end;background:var(--ink);color:#fff;border-radius:18px;padding:13px 16px;font:400 14.5px/1.45 Inter;max-width:88%}
.you small{display:block;font:600 11.5px Inter;color:#AEB6CC;margin-bottom:5px}
.sy{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 16px;font:400 14.5px/1.45 Inter;color:var(--ink)}
.sy small{display:flex;align-items:center;gap:6px;font:600 11.5px Inter;color:var(--muted);margin-bottom:6px}
.comp{border:1px solid var(--line);border-radius:20px;background:#fff;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(10,16,36,.06)}
.comp .txt{min-height:66px;font:400 15px/1.5 Inter;color:var(--ink)}
.comp .ph{color:#98A0B8}
.comp .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.send{height:40px;border-radius:20px;padding:0 18px;display:flex;align-items:center;gap:8px;font:600 14px Inter;color:#fff;background:#8A90A0}
.send.on{background:var(--ink)}
.caret{display:inline-block;width:2px;height:19px;background:var(--signal);vertical-align:-3px;margin-left:1px}
.ctx{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font:400 13px/1.45 Inter;color:var(--ink2)}
/* ---------- site 3M ---------- */
.site{width:1200px;background:#fff;font-family:Lato;color:var(--anth)}
.s-head{height:86px;display:flex;align-items:center;gap:14px;padding:0 48px;border-bottom:1px solid #EEE8DE;background:#fff}
.s-head nav{margin-left:auto;display:flex;gap:30px;font:700 15px Lato;color:var(--txt)}
.btn{background:var(--g);color:var(--chaux);font:700 16px Outfit;border-radius:12px;padding:14px 22px;display:inline-flex;align-items:center;gap:10px}
.btn.o{background:transparent;color:var(--g);box-shadow:inset 0 0 0 2px var(--g)}
.eyeb3{font:900 13px Lato;letter-spacing:.2em;color:var(--g)}
.h1{font:800 64px/1.02 Outfit;letter-spacing:-.02em;color:var(--anth)}
.h2{font:800 42px/1.08 Outfit;letter-spacing:-.015em;color:var(--anth)}
.p{font:400 19px/1.55 Lato;color:var(--txt)}
.ph3{border-radius:26px;background-size:cover;background-position:center}
.num{font:800 15px Outfit;color:var(--ocre);letter-spacing:.08em}
.card3{background:var(--chaux);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:12px}
.field{border:1.5px solid #D9D2C5;border-radius:12px;background:#fff;height:52px;display:flex;align-items:center;padding:0 16px;font:400 16px Lato;color:#8A8F90}
/* ---------- divers ---------- */
.app{border-radius:22px;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.app .hd{height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;font:700 16px Inter;color:#fff}
</style>
<script src="icons.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const I = (n, s = 18, sw = 2) => `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" style="stroke-width:${sw}">${ICONS[n] || ""}</svg>`;
const E = (s = 32) => `<svg viewBox="0 0 64 64" width="${s}" height="${s}"><rect width="64" height="64" rx="16" fill="#0A1024"/><path d="M18 20h22v6H25v4h13v6H25v4h15v6H18z" fill="#fff"/><circle cx="46" cy="44" r="5" fill="#2F5BEA"/></svg>`;
const M3 = window.M3G || null;
/** Badge fictif 3M : carré arrondi vert enduit, « 3M » à la chaux, trait d'enduit ocre. */
const badge = (s) => `<svg viewBox="0 0 240 240" width="${s}" height="${s}" style="display:block;flex:none"><rect x="6" y="6" width="228" height="228" rx="52" fill="#1E6B5E"/><text x="120" y="142" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="118" letter-spacing="-4" fill="#F3EEE6">3M</text><path d="M58 176 Q120 204 184 168" fill="none" stroke="#E3A53C" stroke-width="14" stroke-linecap="round"/></svg>`;
const T = "../assets/tex/";
const photo = (k) => `url(${T}photo-${k}.jpg)`;
const boards = [];
const board = (id, w, h, html, style = "") => boards.push(`<div data-board="${id}" style="width:${w}px;height:${h}px;${style}">${html}</div>`);

/* ================= Site 3M (fictif) ================= */
const SEC = {
  head: () => `<div class="s-head">${badge(46)}<div style="font:800 22px Outfit;letter-spacing:-.01em">3M Plâtrerie Peinture</div><nav><span>Prestations</span><span>Réalisations</span><span>Notre approche</span><span>Contact</span></nav><span class="btn" style="margin-left:26px;padding:11px 18px;font-size:15px">Demander un devis</span></div>`,
  hero: () => `<div style="height:600px;display:grid;grid-template-columns:1.02fr 1fr;gap:44px;padding:56px 48px;background:linear-gradient(180deg,#fff, #FBF8F3)">
     <div style="display:flex;flex-direction:column;justify-content:center;gap:22px"><div class="eyeb3">PLÂTRERIE · PEINTURE · ENDUITS</div><div class="h1">Des murs nets, des finitions soignées.</div><div class="p">Plaques de plâtre, enduits, peinture intérieure et rénovation de vos pièces.</div><div style="display:flex;gap:14px;margin-top:6px"><span class="btn">Demander un devis ${I("arrow-up", 18, 2.4).replace('class="ic"', 'class="ic" style="transform:rotate(45deg)"')}</span><span class="btn o">Nos réalisations</span></div></div>
     <div class="ph3" style="background-image:${photo("apres")};box-shadow:0 30px 60px rgba(31,42,46,.18)"></div></div>`,
  presta: () => `<div style="height:440px;padding:52px 48px;background:#fff"><div style="display:flex;align-items:flex-end;justify-content:space-between"><div><div class="eyeb3">NOS MÉTIERS</div><div class="h2" style="margin-top:10px">Nos prestations</div></div><div class="p" style="max-width:420px;font-size:17px">Une seule équipe, du support à la finition.</div></div>
     <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px">${[["01", "Plâtrerie", "Cloisons, plafonds et doublages.", "hammer"], ["02", "Enduits", "Lissage, rebouchage et finitions.", "layout-template"], ["03", "Peinture intérieure", "Murs, plafonds et boiseries.", "palette"]].map(([n, t, d, ic]) => `<div class="card3"><div style="display:flex;justify-content:space-between;align-items:center"><span class="num">${n}</span><span style="color:var(--g)">${I(ic, 30, 1.8)}</span></div><div style="font:800 26px Outfit">${t}</div><div class="p" style="font-size:16px">${d}</div></div>`).join("")}</div></div>`,
  reno: (hl) => `<div style="height:470px;display:grid;grid-template-columns:1fr 1.05fr;gap:44px;padding:44px 48px;background:var(--chaux);position:relative">${hl ? '<div style="position:absolute;inset:8px;border:4px solid #2F5BEA;border-radius:22px"></div>' : ""}
     <div class="ph3" style="background-image:${photo("cloison")}"></div>
     <div style="display:flex;flex-direction:column;justify-content:center;gap:18px"><div class="eyeb3">RÉNOVATIONS INTÉRIEURES</div><div class="h2">Rénovez une pièce, du support à la finition.</div><div class="p">Cloisons, enduits et peinture : une seule équipe suit tout votre chantier.</div>
     <div style="display:flex;flex-direction:column;gap:10px;font:700 17px Lato;color:var(--anth)">${["Protection des sols et du mobilier", "Nettoyage en fin de journée", "Devis détaillé avant travaux"].map((x) => `<div style="display:flex;gap:10px;align-items:center"><span style="width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center">${I("check", 16, 3)}</span>${x}</div>`).join("")}</div></div></div>`,
  real: () => `<div style="height:480px;padding:48px;background:#fff"><div style="display:flex;align-items:flex-end;justify-content:space-between"><div><div class="eyeb3">AVANT / APRÈS</div><div class="h2" style="margin-top:10px">Nos réalisations</div></div><div style="display:flex;gap:8px;font:700 14px Lato">${["Tout", "Plâtrerie", "Peinture"].map((x, i) => `<span style="padding:9px 16px;border-radius:20px;${i ? "background:var(--chaux);color:var(--txt)" : "background:var(--anth);color:#fff"}">${x}</span>`).join("")}</div></div>
     <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px">${[["avant", "Séjour — avant"], ["apres", "Séjour — après"], ["peinture", "Mur ocre, pièce de vie"]].map(([k, t]) => `<div><div class="ph3" style="height:230px;border-radius:20px;background-image:${photo(k)}"></div><div style="font:800 20px Outfit;margin-top:12px">${t}</div></div>`).join("")}</div></div>`,
  devis: () => `<div style="height:450px;padding:50px 48px;background:var(--g);display:grid;grid-template-columns:1fr 1.1fr;gap:44px;color:var(--chaux)">
     <div style="display:flex;flex-direction:column;justify-content:center;gap:18px"><div style="font:900 13px Lato;letter-spacing:.2em;color:var(--ocre)">DEVIS</div><div style="font:800 46px/1.05 Outfit">Votre projet, en deux étapes.</div><div style="font:400 19px/1.5 Lato;opacity:.9">Décrivez vos travaux, ajoutez quelques photos : nous revenons vers vous avec un devis.</div></div>
     <div style="background:#fff;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px;color:var(--anth)"><div style="font:800 20px Outfit">Étape 1 · Vos travaux</div><div class="field" style="justify-content:space-between;color:var(--anth)">Rénovation intérieure ${I("chevron-down", 18)}</div><div class="field">Pièces concernées</div><div class="field" style="height:70px;border-style:dashed;justify-content:center;gap:10px">${I("image", 20)} Ajouter des photos</div><span class="btn" style="justify-content:center">Continuer</span></div></div>`,
  foot: () => `<div style="height:130px;background:var(--anth);display:flex;align-items:center;gap:16px;padding:0 48px;color:#C9CFD1">${badge(48)}<div><div style="font:800 20px Outfit;color:#fff">3M Plâtrerie Peinture</div><div style="font:400 14px Lato">Plâtrerie · Peinture · Enduits</div></div><div style="margin-left:auto;display:flex;gap:24px;font:400 14px Lato"><span>Mentions légales</span><span>Cookies</span><span>Contact</span></div></div>`,
};
const H = { head: 86, hero: 600, presta: 440, reno: 470, real: 480, devis: 450, foot: 130 };
for (const k of Object.keys(SEC)) board("sec-" + k, 1200, H[k], `<div class="site">${SEC[k]()}</div>`);
const siteHTML = (order, hl) => `<div class="site">${order.map((k) => SEC[k](k === "reno" && hl)).join("")}</div>`;
const V1 = ["head", "hero", "presta", "reno", "real", "devis", "foot"], V2 = ["head", "hero", "reno", "presta", "real", "devis", "foot"];

/* ================= Studio : fenêtre de navigateur ================= */
function chrome() {
  return `<div class="chrome"><div class="dots"><i style="background:#F26B5B"></i><i style="background:#F5BD4F"></i><i style="background:#5FC454"></i></div><div class="tab">${E(18)}<span>3M Plâtrerie Peinture · E-COM STUDIO ia</span><span style="margin-left:auto;color:#9AA2B6">${I("x", 14)}</span></div></div>
  <div class="bar"><span style="transform:rotate(-90deg)">${I("arrow-up", 18)}</span><span style="transform:rotate(90deg);opacity:.5">${I("arrow-up", 18)}</span><span>${I("history", 17)}</span><div class="addr"><span>${I("shield-check", 14)}</span></div></div>`;
}
const NAV = [["VOTRE PROJET", [["compass", "Pilote"]]], ["CRÉER", [["briefcase", "Activité"], ["palette", "Stratégie"], ["palette", "Marque"], ["store", "Site"], ["hammer", "Réalisations"], ["image", "Images"], ["film", "Vidéos"]]], ["DIFFUSER", [["send", "Publications"], ["megaphone", "Publicités"], ["newspaper", "Blog"]]]];
function sidebar(active) {
  return `<div class="side"><div class="logo">${E(32)}<span>E-COM STUDIO</span><span class="ia">ia</span><span style="margin-left:auto;color:var(--muted)">${I("panel-left-close", 18)}</span></div>
  <div class="proj"><div class="sq">${I("store", 18)}</div><div style="min-width:0"><div style="font:600 14px Inter;white-space:nowrap">3M Plâtrerie Peinture</div><div style="font:400 12px Inter;color:var(--muted)">Plâtrerie · peinture</div></div><span style="margin-left:auto;color:var(--muted)">${I("chevron-down", 16)}</span></div>
  ${NAV.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([ic, l]) => `<div class="it${l === active ? " on" : ""}">${I(ic, 18)}${l}</div>`).join("")).join("")}
  <div class="grp" style="display:flex;justify-content:space-between">OUTILS AVANCÉS ${I("chevron-down", 14)}</div>
  <div style="margin-top:auto;border-top:1px solid var(--line);padding-top:10px">${[["film", "Tutoriels vidéo"], ["user-round", "Mon compte"], ["log-out", "Déconnexion"]].map(([ic, l]) => `<div class="it" style="font-size:13.5px">${I(ic, 17)}${l}</div>`).join("")}</div></div>`;
}
function topbar(title, sub) {
  return `<div class="top"><div><div class="ttl">${title}</div><div class="sub">${sub}</div></div><div style="margin-left:auto;display:flex;gap:8px;align-items:center"><div class="pill" style="width:180px;color:var(--muted)">${I("search", 16)}Aller à…<span style="margin-left:auto;font:500 10.5px monospace;border:1px solid var(--line);border-radius:5px;padding:1px 5px">Ctrl K</span></div><div class="pill blue">${I("film", 15)}Tutoriel</div><div class="pill" style="border:none;background:none">${I("bell", 17)}</div><div class="fr"><b>FR</b><span>EN</span></div><div class="pill" style="width:36px;justify-content:center;padding:0">${I("moon", 16)}</div></div></div>`;
}
function synaPanel(body) {
  return `<div class="syna"><div class="synh"><span style="display:flex;gap:8px;align-items:center">${I("sparkles", 16)}SYNA · Une mémoire pour tout le Studio</span>${I("x", 18)}</div>
  <div style="padding:16px 18px 12px;border-bottom:1px solid var(--line)"><div class="eyeb">${I("sparkles", 15)}SYNA · Votre projet, une conversation</div><div style="font:700 21px Brico;letter-spacing:-.02em;margin:9px 0 6px">SYNA</div><div style="font:400 13.5px/1.5 Inter;color:var(--ink2)">Je suis SYNA. Décrivez-moi votre projet en quelques mots. Vos réponses sont sauvegardées ; chaque réflexion attend votre accord sur son coût.</div><div class="note" style="margin-top:9px">${I("shield-check", 14)}Vos choix restent les vôtres. Aucune publication automatique.</div></div>
  <div style="flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0">${body}</div></div>`;
}
function composer(text, active, caret) {
  return `<div class="comp"><div class="txt">${text ? text + (caret ? '<span class="caret"></span>' : "") : '<span class="ph">Votre idée, votre activité, ce qui compte pour vous…</span>'}</div><div class="row"><span style="display:flex;gap:7px;align-items:center;font:500 13px Inter;color:var(--muted)">${I("paperclip", 16)}Lien / photo</span><span class="send${active ? " on" : ""}">${I("send", 16)}Enregistrer</span></div></div>`;
}
/* --- écran d'entrée : « Quel projet souhaitez-vous créer ? » --- */
const MSG1 = "Syna, je suis plâtrier-peintre. Aide-moi à développer ma visibilité.";
function entree(text, caret, sent) {
