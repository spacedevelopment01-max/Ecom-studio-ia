<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="commun.css">
<style>
body { width: 540px; height: 960px; background: var(--ab-nuit); color: #fff; position: relative; }
.barres { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 6px; z-index: 2; } .barres i { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.4); } .barres i:first-child { background: #fff; }
.tete { position: absolute; top: 36px; left: 18px; display: flex; align-items: center; gap: 12px; z-index: 2; font-family: "Montserrat"; font-weight: 700; font-size: 20px; }
.tete img { width: 46px; height: 46px; border-radius: 50%; }
.moitie { position: relative; height: 400px; overflow: hidden; } .moitie img { width: 100%; height: 100%; object-fit: cover; }
.m1 { margin-top: 0; } .m2 { border-top: 6px solid var(--ab-bleu); }
.tag { position: absolute; left: 22px; bottom: 20px; font-family: "Montserrat"; font-weight: 800; font-size: 34px; letter-spacing: .08em; background: rgba(11,23,54,.85); padding: 8px 18px; border-radius: 14px; }
.m2 .tag { background: var(--ab-bleu); }
.bas { padding: 30px 26px; } .bas h2 { font-weight: 800; font-size: 36px; line-height: 1.08; } .bas p { font-size: 20px; color: #C9D6FF; margin-top: 10px; }
</style></head><body class="ab" style="color:#fff">
<div class="barres"><i></i><i></i><i></i></div>
<div class="tete"><img src="img/logo-atelier-bleu.svg">Atelier Bleu</div>
<div class="moitie m1"><img src="img/salon-avant.jpg"><span class="tag">AVANT</span></div>
<div class="moitie m2"><img src="img/salon-apres.jpg"><span class="tag">APRÈS</span></div>
<div class="bas"><h2 style="color:#fff">Peinture intérieure</h2><p>Lyon et ses environs</p></div>
</body></html>
