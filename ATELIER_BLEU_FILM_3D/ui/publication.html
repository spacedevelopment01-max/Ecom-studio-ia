<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="commun.css">
<style>
body { width: 600px; height: 790px; background: #fff; }
.tete { display: flex; align-items: center; gap: 14px; padding: 18px 22px; }
.tete img { width: 50px; height: 50px; border-radius: 50%; }
.tete b { font-family: "Montserrat"; font-weight: 700; font-size: 21px; display: block; } .tete small { font-size: 16px; color: #5B6785; }
.visuel { position: relative; width: 600px; height: 600px; overflow: hidden; }
.visuel img.photo { width: 100%; height: 100%; object-fit: cover; }
.bande { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(11,23,54,0), rgba(11,23,54,.94) 42%); padding: 90px 28px 26px; color: #fff; }
.chip { display: inline-block; background: var(--ab-bleu); font-family: "Montserrat"; font-weight: 700; font-size: 17px; letter-spacing: .12em; padding: 8px 14px; border-radius: 10px; }
.bande h2 { font-weight: 800; font-size: 40px; line-height: 1.05; margin-top: 12px; }
.marque { position: absolute; top: 20px; left: 20px; width: 54px; height: 54px; }
.actions { display: flex; gap: 22px; padding: 16px 22px; } .actions svg { width: 32px; height: 32px; stroke: #0B1736; fill: none; stroke-width: 2; }
.leg { padding: 0 22px; font-size: 19px; color: #0B1736; } .leg b { font-weight: 700; }
</style></head><body class="ab">
<div class="tete"><img src="img/logo-atelier-bleu.svg"><div><b>Atelier Bleu</b><small>Lyon</small></div></div>
<div class="visuel"><img class="photo" src="img/salon-apres.jpg"><img class="marque" src="img/logo-atelier-bleu.svg"><div class="bande"><span class="chip">CHANTIER TERMINÉ</span><h2>Salon repeint à Lyon 3e</h2></div></div>
<div class="actions"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></div>
<p class="leg"><b>Atelier Bleu</b> Mur bleu nuit et plafond blanc mat.</p>
</body></html>
