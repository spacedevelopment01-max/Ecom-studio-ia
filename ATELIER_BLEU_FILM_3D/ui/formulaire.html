<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="commun.css">
<style>
body { width: 1000px; height: 1300px; padding: 44px 52px; }
.barre { display: flex; justify-content: space-between; align-items: center; padding-bottom: 28px; border-bottom: 2px solid var(--line); }
.puce { background: var(--signal-soft); color: var(--signal); font-weight: 700; font-size: 21px; padding: 10px 18px; border-radius: 999px; }
h1 { font-size: 58px; line-height: 1.04; margin: 40px 0 10px; font-weight: 700; }
.sous { font-size: 25px; color: var(--muted); margin-bottom: 30px; }
.nom { display: flex; align-items: center; gap: 18px; background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 18px 24px; margin-bottom: 22px; }
.nom img { width: 58px; height: 58px; }
.nom div small { display: block; font-size: 19px; color: var(--muted); font-weight: 600; }
.nom div b { font-family: "Montserrat"; font-weight: 800; letter-spacing: .08em; font-size: 30px; color: var(--ab-nuit); }
.champ { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 18px 24px 20px; margin-bottom: 18px; display: grid; grid-template-columns: 64px 1fr; column-gap: 18px; align-items: center; }
.champ .ico { grid-row: span 2; width: 64px; height: 64px; border-radius: 18px; background: var(--paper-2); display: grid; place-items: center; }
.champ .ico svg { width: 34px; height: 34px; stroke: var(--ink-2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.champ label { font-size: 21px; font-weight: 700; color: var(--muted); text-transform: none; }
.champ .val { font-size: 37px; font-weight: 600; color: var(--ink); line-height: 1.2; min-height: 46px; white-space: nowrap; }
.etat-vide .champ .val span { visibility: hidden; }
.etat-plein .champ { border-color: var(--signal); box-shadow: 0 0 0 5px var(--signal-soft); }
.etat-plein .champ .ico { background: var(--signal); }
.etat-plein .champ .ico svg { stroke: #fff; }
.bouton { margin-top: 26px; background: var(--ink); color: #fff; font-weight: 700; font-size: 28px; border-radius: 18px; padding: 24px; text-align: center; }
</style></head><body class="studio">
<div class="barre"><span class="logo-studio"><img src="img/logo-studio.svg"><span>E-COM STUDIO <i>ia</i></span></span><span class="puce">Le site de mon entreprise de services</span></div>
<h1 class="display">Parlez-nous de votre entreprise</h1>
<p class="sous">Le studio part de ces informations pour tout préparer.</p>
<div class="nom"><img src="img/logo-atelier-bleu.svg"><div><small>Nom de l'entreprise</small><b>ATELIER BLEU</b></div></div>
<div class="champ" data-zone="activite"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="13" height="6" rx="2"/><path d="M16 7h3v5h-8v3"/><path d="M11 15v5"/></svg></span><label>Activité</label><div class="val"><span>Peinture et rénovation</span></div></div>
<div class="champ" data-zone="prestations"><span class="ico"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span><label>Prestations</label><div class="val"><span>Peinture intérieure, murs et plafonds</span></div></div>
<div class="champ" data-zone="zone"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span><label>Zone d'intervention</label><div class="val"><span>Lyon et ses environs</span></div></div>
<div class="champ" data-zone="style"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6L20 9.5l-4 4 1 5.8L12 16.6 7 19.3l1-5.8-4-4 5.4-.9z"/></svg></span><label>Style</label><div class="val"><span>Contemporain et soigné</span></div></div>
<div class="bouton">Créer mon projet</div>
<script src="etat.js"></script></body></html>
