name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Typecheck, tests, Theme Check, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      APP_SECRET: ci-only-secret-not-used-in-production-000000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      # ffmpeg encode les vidéos (déjà présent dans l'image Docker) : les tests de rendu vidéo en ont besoin.
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Shopify Theme Check (11 directions)
        run: |
          for d in atelier clinique brut terroir nocturne pop galerie elan flux joaillerie gourmand; do
            echo "::group::$d"
            npx tsx scripts/theme-check.ts "$RUNNER_TEMP/theme-$d" "$d"
            echo "::endgroup::"
          done

      - name: Shopify Theme Check (thèmes en anglais)
        run: |
          for d in atelier clinique brut terroir nocturne pop galerie elan flux joaillerie gourmand; do
            echo "::group::$d (en)"
            LANG_THEME=en npx tsx scripts/theme-check.ts "$RUNNER_TEMP/theme-en-$d" "$d"
            echo "::endgroup::"
          done

      - name: Shopify Theme Check (boutiques multi-produit et niche)
        run: |
          for d in atelier brut gourmand flux; do
            for t in multi niche; do
              echo "::group::$d / $t"
              npx tsx scripts/theme-check.ts "$RUNNER_TEMP/theme-$d-$t" "$d" "$t"
              echo "::endgroup::"
            done
          done

      - name: Shopify Theme Check (sites de services, 11 directions, FR et EN)
        run: |
          for d in atelier clinique brut terroir nocturne pop galerie elan flux joaillerie gourmand; do
            for l in fr en; do
              echo "::group::$d / services ($l)"
              BUSINESS=services LANG_THEME=$l npx tsx scripts/theme-check.ts "$RUNNER_TEMP/theme-services-$l-$d" "$d"
              echo "::endgroup::"
            done
          done

      - name: Build de production
        run: npm run build

  image-docker:
    name: Image Docker (construction et démarrage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Construction de l'image
        run: docker build -t ecom-studio-ia:ci .

      - name: Démarrage et vérifications
        run: |
          docker run -d --name studio -p 3000:3000 \
            -e APP_SECRET=ci-only-secret-not-used-in-production-000000 \
            -e APP_URL=http://localhost:3000 \
            -v studio-data:/data ecom-studio-ia:ci
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/api/health | grep -q '"worker":"actif"'; then break; fi
            sleep 2
          done
          curl -fs http://localhost:3000/api/health
          echo
          curl -fs -o /dev/null -w "Accueil : %{http_code}\n" http://localhost:3000/
          curl -fs -o /dev/null -w "Inscription : %{http_code}\n" http://localhost:3000/inscription
          curl -fs http://localhost:3000/api/health | grep -q '"worker":"actif"'
          docker exec studio ffmpeg -version | head -1

      - name: Journaux du conteneur
        if: always()
        run: docker logs studio 2>&1 | tail -80 || true
