name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Typecheck, tests, Theme Check, build
    runs-on: ubuntu-latest
    # Suite fusionnée (#194) : environ 35 min en temps normal, coupée deux fois à 45 min sur des machines lentes
    # (tests 21 min, ou installation de ffmpeg 10 min), sans aucun échec. Limite relevée, aucun contrôle retiré.
    timeout-minutes: 75
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      APP_SECRET: ci-only-secret-not-used-in-production-000000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      # ffmpeg encode les vidéos (déjà présent dans l'image Docker) : les tests de rendu vidéo en ont besoin.
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests (réseau fournisseur interdit)
        run: NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=$GITHUB_WORKSPACE/scripts/lot9/network-guard.mjs" npm test

      - name: "Shopify Theme Check (30 thèmes : FR, EN, multi-produit, niche, services FR et EN, ZIP client)"
        run: JOBS=4 scripts/verify-theme.sh

      - name: Build de production
        run: npm run build

      # Lot A #209 : vraies routes du build, deux comptes fictifs et réseau extérieur interdit ; aucun worker.
      - name: Conversation lot A sur le build compilé (sans fournisseur)
        run: NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=$GITHUB_WORKSPACE/scripts/lot9/network-guard.mjs" npx tsx scripts/verify-agent209-build.ts

      # Lot B #211 : SDK natif vers un faux serveur loopback, jamais une API fournisseur réelle.
      - name: Dialogue IA lot B sur le build compilé (fournisseur HTTP simulé)
        run: NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=$GITHUB_WORKSPACE/scripts/lot9/network-guard.mjs" npx tsx scripts/verify-agent211-build.ts

      # Le build compilé peut différer du code source (empaquetage Next) : export Shopify par la vraie route du serveur
      # compilé, Theme Check réellement exécuté et 0 erreur exigée (#202). Base et démonstration fictives, aucune IA.
      - name: Export Shopify contrôlé sur le build compilé
        run: npx tsx scripts/export-shopify-build-check.ts

  image-docker:
    name: Image Docker (construction et démarrage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Construction de l'image
        run: docker build -t ecom-studio-ia:ci .

      - name: Démarrage et vérifications
        run: |
          docker run -d --name studio -p 3000:3000 \
            -e APP_SECRET=ci-only-secret-not-used-in-production-000000 \
            -e APP_URL=http://localhost:3000 \
            -v studio-data:/data ecom-studio-ia:ci
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/api/health | grep -q '"worker":"actif"'; then break; fi
            sleep 2
          done
          curl -fs http://localhost:3000/api/health
          echo
          curl -fs -o /dev/null -w "Accueil : %{http_code}\n" http://localhost:3000/
          curl -fs -o /dev/null -w "Inscription : %{http_code}\n" http://localhost:3000/inscription
          curl -fs http://localhost:3000/api/health | grep -q '"worker":"actif"'
          docker exec studio ffmpeg -version | head -1

      - name: Journaux du conteneur
        if: always()
        run: docker logs studio 2>&1 | tail -80 || true
