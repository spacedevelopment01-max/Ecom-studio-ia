    (function () {
      const FM = window.FMTV, CAPS = window.CAPS;

      const tl = gsap.timeline({ paused: true });
      CAPS.forEach((g, i) => {
        const id = "#cap-" + i, words = document.querySelectorAll(id + " .cap-w");
        // Le groupe arrive d'un coup (mots en gris clair), chaque mot passe au bleu quand il est dit, puis à l'encre
        tl.fromTo(id, { opacity: 0, y: 18, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "back.out(2)" }, g.s);
        g.w.forEach((w, k) => {
          tl.fromTo(words[k], { color: "#A7B1C6", scale: 1 }, { color: "#2F5BEA", scale: 1.1, duration: 0.08, ease: "power2.out", immediateRender: false }, w.s);
          const next = k + 1 < g.w.length ? g.w[k + 1].s : Math.min(w.e + 0.2, g.e - 0.12);
          tl.to(words[k], { color: "#0A1024", scale: 1, duration: 0.1, ease: "power2.out" }, Math.max(w.s + 0.08, next));
        });
        tl.to(id, { opacity: 0, duration: 0.1, ease: "power2.in" }, g.e - 0.1);
        tl.set(id, { opacity: 0, visibility: "hidden" }, g.e);
      });
      window.__timelines["sous-titres"] = tl;
