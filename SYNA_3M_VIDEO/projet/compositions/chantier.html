<template>

  </style>
  <div id="root" data-composition-id="chantier" data-width="1920" data-height="1080">
    <div id="ch-bump" style="position:absolute;inset:0"><div id="ch-cam"><div id="ch-tilt"><div id="ch-iso" data-layout-ignore><div id="ch-ground"></div></div></div></div></div>

      <div id="ch-logos" class="ch-logos">
        <div id="ch-lg1" class="ch-logo" style="background:#FFE14D"><div style="font:900 104px 'Archivo Black';color:#FF3EA5;transform:rotate(-8deg)">3M!</div></div>
        <div class="ch-neq">≠</div>
        <div id="ch-lg2" class="ch-logo" style="background:#7B2FF7"><div style="font:italic 700 92px 'Playfair Display';color:#fff">3m</div></div>
        <div class="ch-neq">≠</div>
        <div id="ch-lg3" class="ch-logo" style="background:#F4F4F4"><div style="font:500 86px Oswald;color:#6E6E6E;letter-spacing:.12em">3-M</div></div>
        <div class="ch-neq">≠</div>
        <div id="ch-lg4" class="ch-logo" style="background:#FF7A00"><div style="font:800 74px Poppins;color:#111;line-height:.9;text-align:center">3M<br><span style="font-size:30px;letter-spacing:.2em">PEINTURE</span></div></div>

  <script src="assets/iso.js"></script>
  <script src="assets/cues.js"></script>
  <script>
    (function () {
      const C = window.CUES;
      const iso = document.getElementById("ch-iso");
      const O = 1500, P = (v) => v + O;
      let seed = 7331;
      const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      for (let i = -3; i <= 3; i++) {
        ISO.flat(iso, { cls: "ch-street", x: P(i * 380 + 190 - 60), y: P(-1330), w: 120, d: 2660, z: 0.2 });
        ISO.flat(iso, { cls: "ch-street", x: P(-1330), y: P(i * 380 + 190 - 60), w: 2660, d: 120, z: 0.2 });
      }
      // Ville blanche : les maisons sortent du sol en vague depuis le centre
      const houses = [], pins = [];
      for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) {
        if (Math.abs(i) <= 1 && Math.abs(j) <= 1) continue;
        const w = 150 + Math.round(rnd() * 80), d = 150 + Math.round(rnd() * 80), h = 70 + Math.round(rnd() * 140);
        const cx = i * 380 - w / 2 + (rnd() - 0.5) * 30, cy = j * 380 - d / 2 + (rnd() - 0.5) * 30;
        const id = "ch-house" + houses.length;
        const hd = ISO.holder(iso, { id, cls: "ch-house", x: P(cx), y: P(cy) });
        ISO.shadow(hd, { x: 30, y: 30, w: w + 40, d: d + 40, a: 0.1 });
        const b = ISO.box(hd, { w, d, h, color: "#FFFFFF", left: "#EEF1F6", right: "#DCE2EB" });
        b._faces.fy.innerHTML = '<div style="display:flex;gap:18px;padding:' + Math.max(14, h / 3) + 'px 20px">' + '<i style="display:block;width:26px;height:30px;background:#D3E2F2;border-radius:4px"></i>'.repeat(Math.max(1, Math.floor((w - 30) / 46))) + "</div>";
        houses.push({ id, dist: Math.hypot(i, j) });
        if (Math.abs(i) + Math.abs(j) <= 4 && (i + j) % 2 === 0) pins.push({ x: cx + w / 2, y: cy + d / 2, z: h });
      }
      pins.forEach((p, k) => {
        const hd = ISO.holder(iso, { id: "ch-pinh" + k, cls: "ch-pinh", x: P(p.x), y: P(p.y) });
        ISO.panelX(hd, { x: -40, y: 0, z: p.z + 10, w: 80, h: 110, html: '<svg viewBox="0 0 80 110" style="width:100%;height:100%"><path d="M40 106C40 106 8 64 8 40a32 32 0 1 1 64 0c0 24-32 66-32 66z" fill="#A3ABBA"/><circle cx="40" cy="40" r="16" fill="#fff"/><circle cx="37" cy="37" r="7" fill="none" stroke="#A3ABBA" stroke-width="4"/><path d="M42 42l7 7" stroke="#A3ABBA" stroke-width="4" stroke-linecap="round"/></svg>' });
      });

      // ---- La pièce en chantier ----
      const room = ISO.holder(iso, { id: "ch-room", x: P(-260), y: P(-210) });
      ISO.shadow(room, { x: 40, y: 50, w: 600, d: 480, a: 0.14 });
      ISO.box(room, { w: 520, d: 420, h: 20, color: "#E2E6EC", left: "#CDD3DC", right: "#B9C1CD" });
      ISO.flat(room, { x: 150, y: 70, w: 300, d: 120, z: 20.6, html: '<div style="width:100%;height:100%;background:#D3E2F2;border-radius:6px;opacity:.9"></div>' });
      const joints = [120, 240, 360, 480].map((x) => '<i style="position:absolute;left:' + (x - 6) + 'px;top:0;width:12px;height:100%;background:#E6E9EE"></i>').join("");
      ISO.panelX(room, { x: 0, y: 0, z: 20, w: 520, h: 300, html:
        '<div style="position:relative;width:100%;height:100%;background:#CDD2D9;overflow:hidden">' + joints +
        '<div id="ch-paint" style="position:absolute;left:0;top:0;width:100%;height:100%;background:#FFFFFF;transform-origin:0 50%"></div>' +
        '<div id="ch-sheen" style="position:absolute;top:0;left:-200px;width:150px;height:100%;background:linear-gradient(90deg,rgba(211,226,242,0),rgba(211,226,242,.9),rgba(211,226,242,0))"></div>' +
        '<div id="ch-roller" style="position:absolute;left:0;top:0;width:0;height:0">' +
        '<svg viewBox="0 0 90 200" style="position:absolute;left:-45px;top:-20px;width:90px;height:200px"><rect x="8" y="0" width="74" height="30" rx="12" fill="#F4F6FA" stroke="#9AA3B2" stroke-width="3"/><path d="M45 30v26h-22v80" fill="none" stroke="#4A5160" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="128" width="16" height="64" rx="7" fill="#2E333B"/></svg></div></div>' });
      ISO.panelY(room, { x: 0, y: 0, z: 20, w: 420, h: 300, html: '<div style="width:100%;height:100%;background:#F7F8FA"></div>' });
      ISO.panelY(room, { x: 4, y: 150, z: 150, w: 250, h: 96, html: '<div style="width:100%;height:100%;background:#3B4149;border-radius:8px;display:grid;place-items:center;text-align:center;color:#FFFFFF;font:500 30px/1.05 Oswald;letter-spacing:.05em">3M PLÂTRERIE<br>PEINTURE</div>' });
      ISO.panelX(room, { x: 360, y: 90, z: 20, w: 110, h: 230, html: '<svg viewBox="0 0 110 230" style="width:100%;height:100%"><path d="M22 228L48 6M88 228L62 6" stroke="#8D949E" stroke-width="9" stroke-linecap="round"/><path d="M42 50h26M36 100h38M30 150h50M25 196h60" stroke="#A9B0B9" stroke-width="8" stroke-linecap="round"/><rect x="40" y="2" width="30" height="12" rx="4" fill="#6E757F"/></svg>' });
      const bk = ISO.box(room, { x: 90, y: 250, z: 20, w: 74, d: 74, h: 78, color: "#FFFFFF", top: "#E8EBF0" });
      bk._faces.top.innerHTML = '<div style="margin:8px;height:58px;border-radius:50%;background:#FFFFFF;box-shadow:inset 0 0 0 4px #C9CFD8"></div>';
      const bag = ISO.box(room, { x: 210, y: 290, z: 20, w: 120, d: 80, h: 42, color: "#EEF1F6" });
      bag._faces.fy.innerHTML = '<div style="font:700 18px Oswald;color:#3B4149;text-align:center;line-height:42px;letter-spacing:.18em">ENDUIT</div>';

      // ---- Outils éparpillés ----
      const wins = [
        { id: 1, x: -760, y: 120, name: "Logo", body: '<div style="width:100%;height:100%;background:#FFE14D;display:grid;place-items:center"><div id="ch-w1t" style="font:900 86px \'Archivo Black\';color:#FF3EA5">3M!</div></div>' },
        { id: 2, x: -330, y: 470, name: "Visuels", body: '<div style="width:100%;height:100%;background:#7B2FF7;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px"><div style="background:#B794FF;border-radius:8px"></div><div style="display:flex;flex-direction:column;gap:10px"><div style="font:italic 700 46px \'Playfair Display\';color:#fff">3m</div><i style="display:block;height:12px;background:#fff;opacity:.6;border-radius:6px"></i><i style="display:block;height:12px;width:70%;background:#fff;opacity:.6;border-radius:6px"></i></div></div>' },
        { id: 3, x: 300, y: 380, name: "Site", body: '<div style="width:100%;height:100%;background:#fff"><div style="height:40px;background:#B6F500;display:flex;align-items:center;padding:0 14px;font:500 22px Oswald;color:#3B3B3B;letter-spacing:.1em">3-M</div><div style="padding:14px;display:grid;gap:10px"><i style="display:block;height:60px;background:#E4E4E4;border-radius:6px"></i><i style="display:block;height:12px;width:80%;background:#D0D0D0;border-radius:6px"></i><i style="display:block;height:12px;width:55%;background:#D0D0D0;border-radius:6px"></i></div></div>' },
        { id: 4, x: 420, y: -330, name: "Publicités", body: '<div style="width:100%;height:100%;background:#FF7A00;display:grid;place-items:center;text-align:center"><div style="font:800 60px/0.9 Poppins;color:#111">3M<br><span style="font-size:24px;letter-spacing:.2em">PEINTURE</span></div></div>' },
      ];
      wins.forEach((w) => {
        const hd = ISO.holder(iso, { id: "ch-w" + w.id, cls: "ch-w", x: P(w.x), y: P(w.y) });
        ISO.shadow(hd, { x: 40, y: -40, w: 380, d: 110, a: 0.14 });
        ISO.panelX(hd, { x: 0, y: 0, z: 60, w: 360, h: 270, html: '<div class="ch-win"><div class="ch-bar"><i></i><i></i><i></i><b>' + w.name + '</b></div><div class="ch-body">' + w.body + '</div></div><div class="ch-badge"></div>' });
      });
      ISO.flat(iso, { x: P(-1000), y: P(-700), w: 2000, d: 1500, z: 0.8, html: '<svg viewBox="0 0 2000 1500" style="width:100%;height:100%;overflow:visible"><g fill="none" stroke="#7B8394" stroke-width="10" stroke-linecap="round" opacity=".6">' +
        '<path class="ch-cable" d="M420 860 C 600 1000, 760 600, 840 820 S 1000 1000, 760 1010"/>' +
        '<path class="ch-cable" d="M760 1180 C 820 1000, 1100 1220, 980 980 S 900 760, 1240 900"/>' +
        '<path class="ch-cable" d="M1360 1100 C 1300 900, 1500 980, 1240 860 S 1100 700, 1340 640"/>' +
        '<path class="ch-cable" d="M1480 430 C 1300 520, 1420 760, 1200 700 S 980 640, 1060 820"/></g></svg>' });
      const clk = ISO.holder(iso, { id: "ch-clock", x: P(60), y: P(330) });
      ISO.flat(clk, { x: -120, y: -120, w: 240, d: 240, z: 1, html: '<div style="position:relative;width:100%;height:100%;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 10px #0A1024">' +
        Array.from({ length: 12 }, (_, k) => '<i style="position:absolute;left:117px;top:12px;width:6px;height:' + (k % 3 ? 14 : 24) + 'px;background:#0A1024;transform-origin:3px 108px;transform:rotate(' + k * 30 + 'deg)"></i>').join("") +
        '<i id="ch-hh" style="position:absolute;left:114px;top:56px;width:12px;height:66px;border-radius:6px;background:#0A1024;transform-origin:6px 64px"></i>' +
        '<i id="ch-mh" style="position:absolute;left:116px;top:28px;width:8px;height:94px;border-radius:4px;background:#E5383B;transform-origin:4px 92px"></i></div>' });

      // ---------------- Timeline ----------------
      const tl = gsap.timeline({ paused: true });
      const F = ISO.focus;
      tl.fromTo("#ch-tilt", { rotationX: 60 }, { rotationX: 60, duration: 0.01 }, 0);
      tl.fromTo("#ch-iso", { rotationZ: 45 }, { rotationZ: 45, duration: 0.01 }, 0);
      tl.fromTo("#ch-cam", F(-150, -210, 190, 2.4), Object.assign(F(-60, -210, 180, 2.2), { duration: 1.0, ease: "none" }), 0);
      tl.to("#ch-cam", Object.assign(F(-10, 0, 120, 1.22), { duration: 0.85, ease: "expo.inOut" }), 0.95);
      tl.to("#ch-cam", Object.assign(F(0, 0, 110, 1.4), { duration: 2.4, ease: "none" }), 1.8);
      tl.to("#ch-cam", Object.assign(F(0, 0, 0, 0.42, 0, -40), { duration: 1.0, ease: "expo.inOut" }), C["a.probleme"] - 0.15);
      tl.to("#ch-cam", Object.assign(F(-60, 60, 0, 0.46, 0, -40), { duration: 2.0, ease: "none" }), C["a.probleme"] + 0.85);
      tl.to("#ch-cam", Object.assign(F(-120, 60, 60, 0.84, 0, -10), { duration: 0.8, ease: "expo.inOut" }), C["b.start"] - 0.05);
      tl.to("#ch-cam", Object.assign(F(-60, 60, 60, 0.92, 0, -10), { duration: C["b.rien"] - C["b.start"] - 0.75, ease: "none" }), C["b.start"] + 0.75);
      tl.fromTo("#ch-paint", { scaleX: 0.2 }, { scaleX: 1, duration: 3.3, ease: "power1.inOut" }, 0);
      tl.fromTo("#ch-roller", { x: 0.2 * 520 }, { x: 520, duration: 3.3, ease: "power1.inOut" }, 0);
      tl.fromTo("#ch-roller", { y: 60 }, { y: 210, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, 0);
      tl.to("#ch-roller", { opacity: 0, duration: 0.2 }, 3.3);
      tl.fromTo("#ch-sheen", { x: 0 }, { x: 900, duration: 0.8, ease: "power2.inOut" }, C["a.impeccable"] - 0.1);
      houses.forEach((h) => {
        tl.fromTo("#" + h.id, { "--sz": 0.001, scale: 0.001 }, { "--sz": 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, C["a.probleme"] - 0.05 + (h.dist - 1.4) * 0.22);
      });
      tl.fromTo(".ch-pinh", { z: 260, "--sz": 0.001 }, { z: 0, "--sz": 1, duration: 0.5, ease: "bounce.out", stagger: 0.05 }, C["a.trop"] - 0.05);
      tl.to(".ch-pinh", { "--sz": 0.001, duration: 0.25, ease: "power2.in", stagger: 0.02 }, C["b.start"]);
      tl.fromTo("#ch-title1 span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.08, ease: "power2.out" }, C["a.trop"] + 0.1);
      tl.to("#ch-title1 span", { opacity: 0, filter: "blur(6px)", duration: 0.15, stagger: 0.03 }, C["b.start"] - 0.1);
      [[1, "b.logo"], [2, "b.visuels"], [3, "b.site"], [4, "b.pub"]].forEach(([k, c]) => {
        tl.fromTo("#ch-w" + k, { scale: 0.02, "--sz": 0.001, z: 160 }, { scale: 1, "--sz": 1, z: 0, duration: 0.6, ease: "back.out(2)" }, C[c] - 0.1);
      });
      tl.fromTo("#ch-w1t", { rotation: -14, scale: 0.6 }, { rotation: -6, scale: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }, C["b.logo"] + 0.25);
      tl.fromTo(".ch-cable", { opacity: 0 }, { opacity: 1, duration: 0.05, stagger: 0.4 }, C["b.visuels"] - 0.4);
      tl.fromTo(".ch-cable", { strokeDasharray: 1400, strokeDashoffset: 1400 }, { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut", stagger: 0.4 }, C["b.visuels"] - 0.4);
      tl.fromTo("#ch-clock", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, C["b.heures"] - 0.15);
      tl.fromTo("#ch-mh", { rotation: 0 }, { rotation: 1800, duration: 3.2, ease: "power2.in" }, C["b.heures"]);
      tl.fromTo("#ch-hh", { rotation: 20 }, { rotation: 180, duration: 3.2, ease: "power2.in" }, C["b.heures"]);
      tl.fromTo(".ch-badge", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.12 }, C["b.heures"] + 0.1);
      tl.fromTo(".ch-w", { rotationZ: 0 }, { rotationZ: 2.5, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 15, stagger: 0.03, immediateRender: false }, C["b.heures"] + 0.4);
      tl.fromTo("#ch-scrim", { opacity: 0 }, { opacity: 0.86, duration: 0.25, ease: "power2.out" }, C["b.rien"] - 0.2);
      tl.fromTo("#ch-logos .ch-logo", { opacity: 0, y: -260, rotation: (i) => [-20, 14, -10, 18][i] }, { opacity: 1, y: 0, rotation: (i) => [-4, 3, -2, 4][i], duration: 0.42, ease: "back.out(1.6)", stagger: 0.07 }, C["b.rien"] - 0.12);
      tl.fromTo("#ch-logos .ch-neq", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", stagger: 0.07 }, C["b.rien"] + 0.25);
      tl.fromTo("#ch-title2 span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.12, stagger: 0.06, ease: "power2.out" }, C["b.rien"] + 0.1);
      tl.fromTo("#ch-logos", { x: 0 }, { x: 10, duration: 0.04, ease: "none", yoyo: true, repeat: 7 }, C["b.rien"] + 0.62);
      const T0 = C["b.rien"] + 0.85;
      tl.to("#ch-logos .ch-logo, #ch-logos .ch-neq", { y: 900, rotation: (i) => [-24, 10, -8, 16, -12, 9, 22][i], duration: 0.42, ease: "power3.in", stagger: 0.03 }, T0);
      tl.to("#ch-title2", { opacity: 0, filter: "blur(8px)", duration: 0.15 }, T0);
      tl.to("#ch-scrim", { opacity: 0, duration: 0.2 }, T0);
      tl.fromTo("#ch-iso", { rotationZ: 45 }, { rotationZ: 135, duration: 0.55, ease: "power3.in", immediateRender: false }, T0);
      tl.to("#ch-cam", { scale: 0.05, x: 0, y: 0, duration: 0.55, ease: "power3.in" }, T0);
      tl.fromTo("#ch-point", { scale: 0 }, { scale: 0.3, duration: 0.25, ease: "back.out(2.5)" }, T0 + 0.2);
      // Petits chocs de caméra sur chaque impact
      [C["b.logo"], C["b.visuels"], C["b.site"], C["b.pub"], C["b.heures"], C["b.rien"] + 0.1, C["b.rien"] + 0.2].forEach((t0) => tl.fromTo("#ch-bump", { scale: 1 }, { scale: 1.04, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t0));
      window.__timelines["chantier"] = tl;
    })();
  </script>
</template>
