    #st-iris2 { position: absolute; left: 960px; top: 540px; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; background: #FFFFFF; }

    #st-ov { position: absolute; left: 0; top: 0; width: 0; height: 0; }

  </style>
  <div id="root" data-composition-id="studio" data-width="1920" data-height="1080">
    <div class="m3-probe" aria-hidden="true"><span class="m3-o8">3M Aa</span><span class="m3-o7">Devis</span><span class="m3-l4">Aa</span><span class="m3-l6">Aa</span><span class="m3-l7">Aa</span></div>
    <div id="st-iris1"></div>
    <div id="st-iris2"></div>
    <div id="st-world">
      <div id="st-cam"><div id="st-tilt"><div id="st-iso" data-layout-ignore></div></div>
        <div id="st-ov">
          <div id="st-syna" class="st-syna"><div id="st-ring" class="st-ring"></div><div id="st-halo" class="st-halo"></div><div id="st-orb" class="st-orb"></div></div>
        </div>
      </div>
    </div>
    <div id="st-ui">
      <div id="st-brand"><span>E-COM</span> <span>STUDIO</span> <span class="ia">ia</span></div>
      <div id="st-name"><b>Syna</b><small>votre agent</small></div>
      <div id="st-title" class="st-title"><span>Une</span> <span>marque.</span> <span class="acc">Un</span> <span class="acc">seul</span> <span class="acc">endroit.</span></div>
    </div>
  </div>
  <script src="assets/iso.js"></script>
  <script src="assets/brand3m.js"></script>
  <script src="assets/studio-ui.js"></script>
  <script src="assets/cues.js"></script>
  <script>
    (function () {
      const CU = window.CUES, S0 = CU["scene.studio"];
      const L = (k) => CU[k] - S0; // temps local
      const iso = document.getElementById("st-iso");
      const O = 1500, P = (v) => v + O;
      ISO.flat(iso, { x: 0, y: 0, w: 3000, d: 3000, z: 0.1, html: '<div style="width:100%;height:100%;background:#F6F8FC;background-image:linear-gradient(#E9EEF6 2px,transparent 2px),linear-gradient(90deg,#E9EEF6 2px,transparent 2px);background-size:100px 100px;border-radius:60px"></div>' });
      // Plateforme
      const plat = ISO.holder(iso, { id: "st-plat", x: P(-1300), y: P(-620) });
      ISO.shadow(plat, { x: 80, y: 90, w: 2700, d: 1300, a: 0.12 });
      ISO.box(plat, { w: 2650, d: 1240, h: 40, color: "#FFFFFF", left: "#E6ECF8", right: "#2F5BEA", r: 30 });
      const Z = 40;

      // ---- Ordinateur portable : socle, clavier, écran (onglet E-COM STUDIO ia) ----
      const LX = -380, LY = -180, LW = 760, LD = 500, SH = 480;
      const lap = ISO.holder(iso, { id: "st-lap", x: P(LX), y: P(LY) });
      ISO.shadow(lap, { x: 30, y: 40, w: LW + 60, d: LD + 40, z: Z + 0.5, a: 0.18 });
      const deck = ISO.box(lap, { z: Z, w: LW, d: LD, h: 22, color: "#E9EDF3", left: "#D3DAE5", right: "#BCC6D4", r: 14 });
      deck._faces.top.innerHTML = '<div style="position:absolute;left:60px;top:150px;width:640px;height:200px;border-radius:10px;background:#D7DEE8;display:grid;grid-template-columns:repeat(14,1fr);gap:6px;padding:10px">' + '<i style="display:block;background:#F4F6FA;border-radius:4px"></i>'.repeat(56) + '</div><div style="position:absolute;left:280px;top:380px;width:200px;height:90px;border-radius:12px;background:#DCE2EB"></div>';
      const hinge = ISO.holder(iso, { id: "st-hinge", x: P(LX), y: P(LY) });
      const lid = ISO.box(hinge, { w: LW, d: 14, h: SH, color: "#CBD3DF", top: "#BFC8D6", left: "#0A1024", right: "#AEB8C8", back: "#D3DAE5" });
      const main =
        '<div style="position:absolute;inset:0;display:flex">' +
        // Discussion avec Syna
        '<div style="width:200px;flex:none;background:#fff;border-right:1px solid #DCE2EE;display:flex;flex-direction:column">' +
        '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #EEF1F7">' + '<span id="lt-avatar">' + UI.orb(24) + '</span><div><div style="font:600 14px Bricolage;color:#0A1024">Syna</div><div style="font:500 9px InterV;color:#5E6886">Discussion</div></div></div>' +
        '<div style="padding:10px;display:flex;flex-direction:column;gap:6px">' +
        '<div id="lt-msg" style="background:#EEF2FB;border-radius:10px 10px 10px 4px;padding:8px 10px;font:500 11px/1.35 InterV;color:#0A1024">Je m\'occupe de tout, au même endroit.</div>' +
        ["Logo", "Identité de marque", "Visuels", "Publicités", "Site internet"].map((n, k) => '<div class="lt-row" id="lt-row' + k + '"><span class="lt-chk"><i id="lt-ck' + k + '"></i></span>' + n + "</div>").join("") +
        "</div></div>" +
        // Aperçu
        '<div id="lt-preview" style="flex:1;position:relative;background:#F5F7FC;overflow:hidden">' +
        '<div class="lt-pv" id="lt-pv0" style="margin:-80px 0 0 -80px">' + M3.badge(160) + "</div>" +
        '<div class="lt-pv" id="lt-pv1" style="margin:-40px 0 0 -130px;display:flex;gap:10px">' + ["#1F2A2E", "#1E6B5E", "#E3A53C", "#F3EEE6", "#D8CDBB"].map((c) => '<i style="display:block;width:44px;height:80px;border-radius:10px;background:' + c + ';box-shadow:inset 0 0 0 1px rgba(10,16,36,.08)"></i>').join("") + "</div>" +
        '<div class="lt-pv" id="lt-pv2" style="margin:-95px 0 0 -95px;width:190px;height:190px">' + M3.post() + "</div>" +
        '<div class="lt-pv" id="lt-pv3" style="margin:-115px 0 0 -65px;width:130px;height:230px">' + M3.ad() + "</div>" +
        '<div class="lt-pv" id="lt-pv4" style="margin:-92px 0 0 -144px;width:288px;height:184px;overflow:hidden;border-radius:8px"><div style="transform:scale(.4);transform-origin:0 0">' + M3.site("lt") + "</div></div>" +
        '<div id="lt-dash" style="position:absolute;inset:14px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px">' +
        '<div class="lt-d" style="background:#fff;border-radius:10px;display:grid;place-items:center">' + M3.badge(70) + "</div>" +
        '<div class="lt-d" style="background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:5px">' + ["#1F2A2E", "#1E6B5E", "#E3A53C", "#F3EEE6", "#D8CDBB"].map((c) => '<i style="display:block;width:16px;height:40px;border-radius:5px;background:' + c + '"></i>').join("") + "</div>" +
        '<div class="lt-d" style="border-radius:10px;overflow:hidden"><div style="width:300px;height:300px;transform:scale(.36);transform-origin:0 0">' + M3.post() + "</div></div>" +
        '<div class="lt-d" style="border-radius:10px;overflow:hidden;background:#F3EEE6"><div style="width:210px;height:372px;transform:scale(.3);transform-origin:0 0">' + M3.ad() + "</div></div>" +
        '<div class="lt-d" style="grid-column:span 2;border-radius:10px;overflow:hidden;background:#fff"><div style="transform:scale(.33);transform-origin:0 0">' + M3.site("ld") + "</div></div>" +
        "</div></div></div>";
      lid._faces.fy.innerHTML = '<div style="position:absolute;inset:12px 12px 16px 12px;border-radius:8px;overflow:hidden;background:#fff">' + UI.browser({ p: "lt", s: 1, side: 140, active: "Marque", main }) + '<div id="lt-boot" style="position:absolute;inset:0;background:#0A1024"></div></div>';
      const HZ = Z + 22 + 14, HZO = Z + 26; // charnière : couvercle fermé posé sur le socle, puis ouvert
      const SCREEN = { x: 70, y: LY + 14, z: HZO + 240 }; // centre de l'aperçu, dans l'écran

      // ---- Stations (créations sorties de l'écran) ----
      const stations = [];
      function station(id, x, y, w, h, html, kind) {
        const hd = ISO.holder(iso, { id, cls: "st-st", x: P(x), y: P(y) });
        ISO.shadow(hd, { x: 0, y: -40, w: w + 40, d: 90, z: Z + 0.5, a: 0.16 });
        if (kind === "Y") ISO.panelY(hd, { x: 0, y: 0, z: Z, w, h, html });
        else ISO.panelX(hd, { x: 0, y: 0, z: Z, w, h, html });
        stations.push({ id, x, y, w, h, kind });
        return hd;
      }
      station("st-A", -1150, -420, 360, 360, M3.logoPanel("st-logo"));
      station("st-B", -760, -150, 300, 200, M3.typo());
      const sw = [["#1F2A2E", 70], ["#1E6B5E", 100], ["#E3A53C", 84], ["#F3EEE6", 56], ["#D8CDBB", 44]];
      sw.forEach(([c, h], k) => {
        const s = ISO.holder(iso, { id: "st-sw" + k, cls: "st-sw", x: P(-760 + k * 64), y: P(-20) });
        ISO.shadow(s, { x: 8, y: 12, w: 72, d: 64, z: Z + 0.5, a: 0.16 });
        ISO.box(s, { w: 52, d: 52, h, z: Z, color: c, r: 6 });
      });
      station("st-C1", 480, -420, 280, 280, M3.post());
      station("st-C2", 800, -420, 200, 356, M3.ad());
      station("st-D", 1140, -260, 720, 460, M3.site("st"), "Y");
      // Ligne de marque au sol, qui passe devant chaque création et devant l'ordinateur
      const pts = [[-970, -330], [-610, 120], [-150, 420], [380, 380], [640, -320], [900, -320], [1080, 120]];
      let d = "M" + (pts[0][0] + O) + " " + (pts[0][1] + O);
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += " C" + (c1[0] + O) + " " + (c1[1] + O) + " " + (c2[0] + O) + " " + (c2[1] + O) + " " + (p2[0] + O) + " " + (p2[1] + O);
      }
      ISO.flat(iso, { x: 0, y: 0, w: 3000, d: 3000, z: Z + 0.8, html: '<svg viewBox="0 0 3000 3000" style="width:100%;height:100%;overflow:visible"><path id="st-line" d="' + d + '" fill="none" stroke="#1E6B5E" stroke-width="18" stroke-linecap="round" pathLength="1000"/>' + pts.map((p) => '<circle class="st-dot" cx="' + (p[0] + O) + '" cy="' + (p[1] + O) + '" r="24" fill="#E3A53C" stroke="#fff" stroke-width="7"/>').join("") + "</svg>" });
      const SS = ISO.holder(iso, { id: "st-synash", x: P(0), y: P(0) });
      ISO.shadow(SS, { x: -70, y: -40, w: 140, d: 80, z: Z + 1, a: 0.24 });

      // ---------------- Timeline ----------------
      const tl = gsap.timeline({ paused: true });
      const F = ISO.focus, pr = ISO.project;
      tl.fromTo("#st-tilt", { rotationX: 60 }, { rotationX: 60, duration: 0.01 }, 0);
      tl.fromTo("#st-iso", { rotationZ: 45 }, { rotationZ: 45, duration: 0.01 }, 0);
      // Double ouverture en cercle : bleu puis blanc
      tl.fromTo("#st-iris1", { scale: 0.3 }, { scale: 16, duration: 0.24, ease: "power1.in" }, 0);
      tl.fromTo("#st-iris2", { scale: 0 }, { scale: 16, duration: 0.3, ease: "power2.in" }, 0.1);
      tl.fromTo("#st-world", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.38);
      tl.fromTo("#st-cam", F(0, 0, 0, 0.38), Object.assign(F(0, -60, 200, 0.62), { duration: 1.3, ease: "expo.out" }), 0.3);
      tl.fromTo("#st-plat", { "--sz": 0.001 }, { "--sz": 1, duration: 0.7, ease: "expo.out" }, 0.3);
      // L'ordinateur tombe sur la plateforme, couvercle fermé
      tl.fromTo("#st-lap", { z: 700 }, { z: 0, duration: 0.7, ease: "bounce.out" }, 0.45);
      tl.fromTo("#st-hinge", { z: 700 + HZ, rotationX: -90 }, { z: HZ, rotationX: -90, duration: 0.7, ease: "bounce.out" }, 0.45);
      // Stations cachées
      tl.fromTo(".st-st, .st-sw", { scale: 0.001, "--sz": 0.001 }, { scale: 0.001, "--sz": 0.001, duration: 0.01 }, 0);
      // Ouverture du couvercle et démarrage de l'onglet
      tl.to("#st-hinge", { rotationX: 10, z: HZO, duration: 0.65, ease: "back.out(1.5)" }, L("c.decouvre") - 0.15);
      tl.fromTo("#lt-boot", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, L("c.decouvre") + 0.35);
      tl.fromTo("#lt-tab", { y: 30 }, { y: 0, duration: 0.35, ease: "expo.out" }, L("c.decouvre") + 0.45);
      tl.fromTo("#lt-msg, .lt-row", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", stagger: 0.05 }, L("c.decouvre") + 0.55);
      tl.fromTo(".lt-chk i", { scale: 0 }, { scale: 0, duration: 0.01 }, 0);
      tl.fromTo(".lt-pv, #lt-dash", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.to("#st-cam", Object.assign(F(-170, LY, HZO + 330, 1.65, 0, 170), { duration: 0.9, ease: "expo.inOut" }), L("c.ecom") - 0.3);
      tl.fromTo("#st-brand span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.08, ease: "power2.out" }, L("c.ecom"));
      tl.to("#st-brand span", { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.04 }, L("c.syna") - 0.3);
      // Syna sort de l'écran (depuis son avatar dans la discussion)
      const av = pr(LX + 176, LY + 14, HZO + SH - 94);
      const s1 = pr(-560, 40, 300);
      tl.fromTo("#st-syna", { x: av.x, y: av.y, scale: 0.15, opacity: 0 }, { x: av.x, y: av.y, scale: 0.15, opacity: 0, duration: 0.01 }, 0);
      tl.to("#st-syna", { opacity: 1, duration: 0.05 }, L("c.syna") - 0.15);
      tl.to("#st-syna", { x: s1.x, duration: 0.6, ease: "power2.inOut" }, L("c.syna") - 0.1);
      tl.to("#st-syna", { y: s1.y, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, L("c.syna") - 0.1);
      tl.fromTo("#st-ring", { scale: 0.3, opacity: 0.9 }, { scale: 2.2, opacity: 0, duration: 0.6, ease: "power2.out" }, L("c.syna") + 0.45);
      tl.fromTo("#st-synash", { x: -560, y: 40, opacity: 0 }, { x: -560, y: 40, opacity: 1, duration: 0.4 }, L("c.syna") + 0.2);
      tl.to("#st-cam", Object.assign(F(-300, -60, 220, 0.86, 0, 40), { duration: 0.7, ease: "expo.inOut" }), L("c.syna") - 0.2);
      const nm = { x: 960 + 0.86 * (s1.x - pr(-300, -60, 220).x) - 380, y: 540 + 40 + 0.86 * (s1.y - pr(-300, -60, 220).y) - 70 };
      tl.fromTo("#st-name", { x: nm.x, y: nm.y, opacity: 0, filter: "blur(8px)" }, { x: nm.x, y: nm.y, opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, L("c.syna") + 0.55);
      tl.to("#st-name", { opacity: 0, filter: "blur(8px)", duration: 0.16 }, L("d.start") - 0.15);
      tl.fromTo("#st-orb, #st-halo", { y: 0 }, { y: -9, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 25, immediateRender: false }, L("c.syna") + 0.7);
      // Construction : chaque création apparaît dans l'aperçu puis sort de l'écran vers sa place
      tl.to("#st-cam", Object.assign(F(-120, -120, 200, 0.6, 0, 30), { duration: 0.6, ease: "expo.inOut" }), L("d.start") - 0.2);
      const fly = (ids, pv, chk, t) => {
        tl.fromTo("#lt-pv" + pv, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, t - 0.45);
        tl.to("#lt-pv" + pv, { opacity: 0, scale: 1.2, duration: 0.12 }, t);
        tl.fromTo("#lt-ck" + chk, { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, t + 0.1);
        ids.forEach((id, k) => {
          const st = stations.find((s) => s.id === id) || { x: -760 + Number(id.slice(-1)) * 64, y: -20, w: 52 };
          const dx = st.kind === "Y" ? SCREEN.x - st.x : SCREEN.x - st.x - (st.w || 52) / 2, dy = st.kind === "Y" ? SCREEN.y - st.y - st.w / 2 : SCREEN.y - st.y;
          const tk = t + k * 0.06;
          tl.fromTo("#" + id, { x: dx, y: dy, z: 120, scale: 0.15, "--sz": 0.15 }, { x: 0, y: 0, scale: 1, "--sz": 1, duration: 0.6, ease: "power3.out", immediateRender: false }, tk);
          tl.fromTo("#" + id, { z: 120 }, { z: 300, duration: 0.28, ease: "power2.out", immediateRender: false }, tk);
          tl.to("#" + id, { z: 0, duration: 0.38, ease: "bounce.out" }, tk + 0.28);
        });
      };
      fly(["st-A"], 0, 0, L("d.logo") + 0.05);
      fly(["st-B", "st-sw0", "st-sw1", "st-sw2", "st-sw3", "st-sw4"], 1, 1, L("d.identite") + 0.05);
      fly(["st-C1"], 2, 2, L("d.visuels") + 0.05);
      fly(["st-C2"], 3, 3, L("d.pub") - 0.05);
      fly(["st-D"], 4, 4, L("d.site") + 0.05);
      // Logo : tracé à la truelle quand il arrive
      tl.fromTo("#st-logo-stroke", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, L("d.logo") + 0.35);
      tl.fromTo("#st-logo-fill", { opacity: 0 }, { opacity: 1, duration: 0.25 }, L("d.logo") + 0.7);
