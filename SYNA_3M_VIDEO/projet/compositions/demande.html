        '<div id="dm-pv"><div class="dm-lbl" style="left:44px;top:30px">Aperçu du site</div>' +

      const h1 = document.getElementById("dm-h1");

      h1.innerHTML = '<span id="dm-h1a" style="display:block">Des murs nets, des finitions soignées.</span><span id="dm-h1b" style="position:absolute;left:0;top:0;display:block">Vos murs, notre métier.</span>';

      (function () {
        // Mise en page fixe (px du film) : fenêtre 70,52 ; barres du navigateur 120 ; barre latérale 300 ; discussion 560.
        const MX = 370, MY = 172, PVX = 930;
        const S = 1.14, SX = PVX + 44, SY = MY + 80; // site posé à 1,14
        const site = (x, y, w, h) => ({ x: SX + x * S, y: SY + y * S, w: w * S, h: h * S });
        const B = {
          btn: site(24, 298, 222, 52), h1: site(24, 148, 340, 82), svc: site(24, 388, 672, 54), site: { x: SX, y: SY, w: 720 * S, h: 460 * S },
          post: { x: PVX + 44, y: MY + 640, w: 174, h: 174 }, ad: { x: PVX + 236, y: MY + 640, w: 99, h: 175 },
          send: { x: 838, y: 937, w: 58, h: 58 },
        };
        const pv = { x: PVX, y: MY };
        const inPv = (b, pad) => ({ x: b.x - pv.x - pad, y: b.y - pv.y - pad, width: b.w + 2 * pad, height: b.h + 2 * pad });
        // Fil de discussion : hauteurs fixées (voir le style des bulles), écart 14, marge haute 20, fenêtre visible 647 px.
        const H = { "dm-m0": 97, "dm-u1": 63, "dm-s1": 51, "dm-u2": 97, "dm-s2": 51, "dm-u3": 97, "dm-u3b": 80, "dm-s3": 51, "dm-u4": 97, "dm-s4": 190, "dm-s5": 51, "dm-s6": 40 };
        const order = Object.keys(H), top = {};
        let yy = 20;
        order.forEach((id) => { top[id] = yy; document.getElementById(id).style.height = H[id] + "px"; yy += H[id] + 14; });
        const VIEW = 647;
        const scrollTo = (id) => Math.min(0, VIEW - 18 - (top[id] + H[id]));

        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#dm-win", { scale: 1.9, x: 520, y: 140, transformOrigin: "0 0" }, { scale: 1, x: 0, y: 0, duration: 0.5, ease: "expo.out" }, 0);

        tl.fromTo("#dm-u1, #dm-s1, #dm-u2, #dm-s2, #dm-u3, #dm-u3b, #dm-s3, #dm-u4, #dm-s4, #dm-s5, #dm-s6", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

        tl.fromTo(".dm-sel", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        tl.fromTo("#dm-m0", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.2);
        const pop = (id, t) => tl.fromTo("#" + id, { opacity: 0, y: 40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, t);
        const scroll = (id, t) => { const y = scrollTo(id); if (y < 0) tl.to("#dm-ti", { y, duration: 0.3, ease: "power3.out" }, t); };
        const sel = (n, b, t, pad) => {
          tl.fromTo("#dm-sel" + n, Object.assign(inPv(b, pad || 10), { opacity: 0, scale: 1.08 }), Object.assign(inPv(b, pad || 10), { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false }), t);
          tl.to("#dm-sel" + n, { opacity: 0, duration: 0.2 }, t + 0.75);
        };
        const ver = (n, t) => tl.to("#dm-vroll", { y: -30 * (n - 1), duration: 0.3, ease: "back.out(2)" }, t);
        const punch = (b, t, hold) => {
          const z = 1.18, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
          const fx = 960 + (cx - 960) * 0.55, fy = 540 + (cy - 540) * 0.55;
          const lx = cx - win0.x, ly = cy - win0.y;
          tl.to("#dm-win", { scale: z, x: fx - win0.x - z * lx, y: fy - win0.y - z * ly, duration: 0.32, ease: "power3.out" }, t);
          tl.to("#dm-win", { scale: 1, x: 0, y: 0, duration: 0.3, ease: "power3.inOut" }, t + hold);
        };

        pop("dm-s1", T1 + 0.05); scroll("dm-s1", T1 + 0.05); ver(2, T1 + 0.1);
        punch(B.btn, T1 - 0.05, 0.7);
        // 2. Un titre
        const T2 = L("f.titre") + 0.15;

        tl.fromTo("#dm-h1b", { opacity: 0, filter: "blur(6px)", y: 10 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, T2 + 0.15);
        pop("dm-s2", T2 + 0.15); scroll("dm-s2", T2 + 0.15); ver(3, T2 + 0.2);
        punch(B.h1, T2 - 0.05, 0.75);

        const T3 = L("f.photos") + 0.05;
        pop("dm-u3", L("f.section") - 0.15); pop("dm-u3b", L("f.section") + 0.05); scroll("dm-u3b", L("f.section") - 0.1);
        sel(1, B.svc, T3 - 0.1, 10);
        tl.to("#dm-svc", { y: 120, opacity: 0, duration: 0.25, ease: "power3.in" }, T3);
        tl.fromTo("#dm-ba", { opacity: 0, y: 110 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, T3 + 0.15);
        pop("dm-s3", T3 + 0.2); scroll("dm-s3", T3 + 0.2); ver(4, T3 + 0.25);
        punch(B.svc, T3 - 0.1, 0.75);
        // 4. L'accent de toute la marque, partout : Syna liste les créations, le client confirme
        pop("dm-u4", L("f.accent") - 0.2); scroll("dm-u4", L("f.accent") - 0.2);

        sel(1, B.site, L("f.marque"), 6); sel(2, B.post, L("f.marque") + 0.08, 6); sel(3, B.ad, L("f.marque") + 0.16, 6);
        const ca = { x: B.all.x + B.all.w / 2 - 10, y: B.all.y + B.all.h / 2 - 6 + scrollTo("dm-s4") };
        const TC = L("f.fois") + 0.35;
        tl.fromTo("#dm-cursor", { x: 1990, y: 1100 }, { x: ca.x, y: ca.y, duration: 0.35, ease: "expo.out", immediateRender: false }, TC - 0.4);
        tl.to("#dm-cursor", { scale: 0.82, duration: 0.06, yoyo: true, repeat: 1, transformOrigin: "10px 6px" }, TC);
        tl.to("#dm-all", { scale: 0.92, duration: 0.06, yoyo: true, repeat: 1 }, TC);
        tl.to("#dm-cursor", { x: 2000, y: 1150, duration: 0.35, ease: "power3.in" }, TC + 0.3);
        const T4 = TC + 0.15;
        ["#dm-postf", "#dm-adf"].forEach((s, i) => {
          tl.fromTo(s, { scaleX: 1 }, { scaleX: 0.001, duration: 0.14, ease: "power2.in", transformOrigin: "50% 50%", immediateRender: false }, T4 + i * 0.08);
          tl.to(s, { scaleX: 1, duration: 0.2, ease: "back.out(2)" }, T4 + 0.14 + i * 0.08);
        });
        tl.to("#dmp-bar", { backgroundColor: "#E3A53C", opacity: 1, duration: 0.01 }, T4 + 0.14);
        tl.to("#dma-cta", { backgroundColor: "#E3A53C", color: "#1F2A2E", duration: 0.01 }, T4 + 0.22);
        tl.to("#dm-eye", { color: "#B7791F", duration: 0.25 }, T4 + 0.05);

        window.__timelines["demande"] = tl;
      })();
